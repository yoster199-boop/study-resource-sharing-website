{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>Edit profile</h1>
    <form method="POST">
      <label>Bio (max 300 characters)</label>
      <textarea name="bio" rows="4" maxlength="300">{{ profile.bio or '' }}</textarea>
      <button class="btn" type="submit">Save</button>
    </form>
    <p class="alt"><a href="/u/{{ profile.username }}">Back to my profile</a></p>
  </div>
{% endblock %}
